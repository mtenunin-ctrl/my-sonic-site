<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonic Gallery</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0000a1;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

    header {
        padding: 20px;
        text-align: center;
        border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    h1 {
        margin: 0;
        font-size: 2rem;
        background: linear-gradient(to right, #00f2ff, #ff00cc);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    /* СЕТКА ГАЛЕРЕИ */
    .gallery-container {
        display: grid;
        /* Магия CSS: авто-заполнение. Карточки будут по 250px, а остальное браузер сам распределит */
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 15px;
        padding: 20px;
        max-width: 1400px;
        margin: 0 auto;
        width: 100%;
        box-sizing: border-box;
    }

    .gallery-item {
        position: relative;
        overflow: hidden;
        border-radius: 10px;
        aspect-ratio: 1 / 1; /* Делает карточки квадратными (можно убрать, если нужны прямоугольники) */
        box-shadow: 0 4px 15px rgb(16, 0, 197);
        cursor: pointer;
        transition: transform 0.3s ease;
    }

    .gallery-item:hover {
        transform: scale(1.05); /* Легкое увеличение при наведении */
        z-index: 10;
    }

    .gallery-item img {
        width: 100%;
        height: 100%;
        object-fit: cover; /* Картинка заполняет квадрат, не искажаясь */
        display: block;
        position: relative;
        z-index: 1;
    }

    footer {
        text-align: center;
        padding: 20px;
        color: #5553d1;
        font-size: 0.9rem;
    }
    </style>
</head>
<body>

    <header>
        <h1>Sonic</h1>
    </header>

    <main class="gallery-container">
    <!-- КАРТОЧКА 1 -->
    <div class="gallery-item">
        <img src="Sonic-1.png" alt="Sonic Art 1">
    </div>

    <!-- КАРТОЧКА 2 -->
    <div class="gallery-item">
        <img src="Sonic-2.jpg" alt="Sonic Art 2">
    </div>

    <!-- КАРТОЧКА 3 -->
    <div class="gallery-item">
        <img src="Sonic-3.jpeg" alt="Sonic Art 3">
    </div>
    <!-- КАРТОЧКА 4 -->
    <div class="gallery-item">
        <img src="Sonic-4.jpeg" alt="Sonic Art 4">
    <div>
    <!-- КАРТОЧКА 5 -->
    <div class="gallery-item">
        <img src="Sonic-5.jpeg" alt="Sonic Art 5">
    <div>
</main>

    <footer>
        &copy; 2026 мои работы с Sonic!
    </footer>

</body>
</html>
